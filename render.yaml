services:
  - type: web
    name: stocklens
    runtime: docker
    plan: 0.5c-512mb
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CACHE_DIR
        value: /app/.cache
      - key: COINGECKO_PLAN
        value: demo
      - key: TRUST_PROXY
        value: ""
